# Concrete-12: twelve-class concrete surface-quality detection benchmark.
# 5,658 images / 9,548 instances -> 4,520 train, 561 val, 577 held-out test.
#
# Expected layout (see README):
#   data/concrete12/images/                    RGB (all splits share one image folder)
#   data/concrete12/annotations/instances_{train,val,test}.json
#   data/depth_concrete12/{train,val,test}/npz/  depth priors

num_classes: 12

train_dataloader:
  dataset:
    img_folder: data/concrete12
    npy_folder: data/depth_concrete12/train/npz
    ann_file: data/concrete12/annotations/instances_train.json

val_dataloader:
  dataset:
    img_folder: data/concrete12
    npy_folder: data/depth_concrete12/val/npz
    ann_file: data/concrete12/annotations/instances_val.json

# To evaluate on the held-out test split (the split reported in the paper):
#
# val_dataloader:
#   dataset:
#     img_folder: data/concrete12
#     npy_folder: data/depth_concrete12/test/npz
#     ann_file: data/concrete12/annotations/instances_test.json
