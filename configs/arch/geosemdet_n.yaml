# GeoSemDet-N layer graph.
#
#   backbone : HGNetv2-B0, tapped at C3 / C4 / C5 (strides 8 / 16 / 32)
#   encoder  : SFP -- Scale-Fused Pyramid. Three levels are kept rather than two, so the
#              stride-8 grid that resolves hairline targets survives alongside the coarse
#              levels. Each of its four merge nodes is a DSM (Directional Strip Mixer);
#              the SRG encoder gate sits on the coarsest level.
#   decoder  : GeoSemDetTransformer = D-FINE decoder + GSA (geometry-steered attention in
#              place of cross-attention) + SRG (adaptive text-logit fusion).
#
# Format: [from, module, args].

backbone:
  - [-1, StemBlock, [16, 16, True]]                                    # 0-P2/4
  - [-1, HG_Stage, [16, 64, 1, 3, False, False, 3, True, 'se']]        # 1-P2/4
  - [-1, HG_Stage, [32, 256, 1, 3, True, False, 3, True, 'se']]        # 2-P3/8   -> C3
  - [-1, HG_Stage, [64, 512, 2, 3, True, True, 5, True, 'se']]         # 3-P4/16  -> C4
  - [-1, HG_Stage, [128, 1024, 1, 3, True, True, 5, True, 'se']]       # 4-P5/32  -> C5

encoder:
  # --- project the three taps to the detector width (128) ---
  - [2, ConvNormLayer_fuse, [128, 1, 1]]                               # 5-P3/8
  - [3, ConvNormLayer_fuse, [128, 1, 1]]                               # 6-P4/16
  - [4, ConvNormLayer_fuse, [128, 1, 1]]                               # 7-P5/32
  - [-1, TransformerEncoderBlock, [8, 512, 0.1, "relu", 10000, False]] # 8-P5/32 (fewest tokens)

  # --- SFP top-down path: upsample + concat, merged by a DSM ---
  - [-1, ConvNormLayer_fuse, [128, 1, 1]]                              # 9
  - [-1, nn.Upsample, [None, 2, "nearest"]]                            # 10
  - [[-1, 6], Concat, []]                                              # 11-P4/16
  - [-1, DSM, [128]]                                                   # 12-P4/16  merge node 1

  - [-1, ConvNormLayer_fuse, [128, 1, 1]]                              # 13
  - [-1, nn.Upsample, [None, 2, "nearest"]]                            # 14
  - [[-1, 5], Concat, []]                                              # 15-P3/8
  - [-1, DSM, [128]]                                                   # 16-P3/8   merge node 2  -> F3

  # --- SFP bottom-up path: stride-2 downsample + concat, merged by a DSM ---
  - [-1, SCDown, [128, 3, 2, 'silu']]                                  # 17-P4/16
  - [[-1, 13], Concat, []]                                             # 18-P4/16
  - [-1, DSM, [128]]                                                   # 19-P4/16  merge node 3  -> F4

  - [-1, SCDown, [128, 3, 2, 'silu']]                                  # 20-P5/32
  - [[-1, 9], Concat, []]                                              # 21-P5/32
  - [-1, DSM, [128]]                                                   # 22-P5/32  merge node 4

  # --- SRG encoder gate on the coarsest level: [c_out, guide_dim, tau_g, gamma_init, gamma_max] ---
  - [-1, SRGEncoderGate, [128, 128, 0.1, 0.001, 0.05]]                 # 23-P5/32              -> F5'

decoder:
  # GSA: depth_sigma_init is the initial bandwidth of the depth-consistency bias.
  # SRG: alpha_init / alpha_max bound the per-query text-logit correction.
  - [[16, 19, 23], GeoSemDetTransformer, {"feat_strides": [8, 16, 32], "hidden_dim": 128, "num_levels": 3, "num_layers": 3, "num_points": [3, 6, 3], "dim_feedforward": 512, "depth_sigma_init": 0.2, "use_text_logits": true, "fuse_text_logits": true, "fusion_mode": "adaptive", "text_scale": 10.0, "alpha_init": 0.01, "alpha_max": 0.15, "text_proj_mode": "identity"}]
